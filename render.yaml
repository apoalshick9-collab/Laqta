# نشر سيرفر لقطة على Render (خطة مجانية)
services:
  - type: web
    name: laqta-server
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MAX_UPLOAD_MB
        value: "50"
